ocal .awg vault, root AGENTS.md/CLAUDE.md, and global registration; these files are currently untracked until committed.","tags":["current-state","git"],"title":"Current repo state after AWG install","type":"artifact","updated_at":"2026-05-12T18:42:29.228Z"},{"awg":"0.1","body":"Current checks include malformed JSON, schema errors, incompatible duplicate IDs, dangling edges, orphan nodes, duplicate-looking aliases, stale review dates, completed tasks without evidence, unanswered questions, low-confidence active nodes, blocked-by-resolved, and implemented-proposed decisions. --strict elevates warnings to fatal.","confidence":0.95,"created_at":"2026-05-12T18:42:29.020Z","id":"n:diagnostic-model","importance":0.85,"kind":"node","provenance":{"created_by":"agent:codex","human_approved":false,"source":"agent_generated","updated_by":"agent:codex"},"status":"active","summary":"Diagnostics distinguish fatal validation/build errors from warnings and drive doctor, lens, and viewer health output.","tags":["diagnostics","validation"],"title":"Diagnostic model","type":"concept","updated_at":"2026-05-12T18:42:29.020Z"},{"awg":"0.1","body":"src/storage/FileAwgStorage.ts locates the nearest plausible project .awg vault, reads config/schema/log entries, appends log entries to today’s JSONL file, and writes compiled artifacts. It excludes compiled files from canonical input and expects log files to match the YYYY/MM/YYYY-MM-DD.awg.jsonl pattern.","confidence":0.9,"created_at":"2026-05-12T18:42:28.285Z","id":"n:file-storage-adapter","importance":0.85,"kind":"node","provenance":{"created_by":"agent:codex","human_approved":false,"source":"agent_generated","updated_by":"agent:codex"},"status":"active","summary":"FileAwgStorage is the current storage backend and should remain the canonical V1 adapter unless a future slice explicitly adds more.","tags":["storage","architecture"],"title":"File storage adapter","type":"concept","updated_at":"2026-05-12T18:42:28.285Z"},{"awg":"0.1","body":"Fo
